<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}The World is Yours{% endblock %}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <!-- bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <!-- navbar (igual em todas as páginas) -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark my-navbar">
            <div class="container">

                <a class="navbar-brand" href="{{ url_for('index') }}">
                    SCARFACE - 1983
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNavbar">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="menuNavbar">
                    <ul class="navbar-nav ms-auto">

                        {% set links = [
                        ('index', 'Início'),
                        ('tony', 'Tony'),
                        ('enredo', 'Enredo'),
                        ('personagens', 'Personagens')
                        ] %}

                        {% for endpoint, nome in links %}
                        <li class="nav-item">
                            <a class="nav-link {% if request.endpoint == endpoint %}active{% endif %}"
                                href="{{ url_for(endpoint) }}">{{ nome }}</a>
                        </li>
                        {% endfor %}

                    </ul>
                </div>

            </div>
        </nav>
    </header>

    <!-- conteúdo de cada página entra aqui -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- footer (igual em todas as páginas) -->
    <footer>
        <h3>SCARFACE - 1983</h3>
        <a href="{{ url_for('index') }}">Voltar ao início</a>
    </footer>

    <!-- JavaScript do Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
